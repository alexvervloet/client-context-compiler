name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # gitleaks scans history, not just the tip. A shallow clone would
          # let a key committed and reverted last week pass unnoticed.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          # Pinned to the runtime the scripts are written for: type stripping
          # is behind a flag on 22 and on by default from 23.6. Both work, but
          # pinning keeps a CI failure from being about the Node version.
          node-version: '22'
          cache: npm

      - run: npm ci

      # Cheap and specific, so they run before anything slow.
      - name: lint
        run: npm run lint

      - name: typecheck
        run: npm run typecheck

      # This repo's whole job is moving client records around, so a real key
      # or record reaching the history is the failure that matters most.
      # Free for personal and public repos; an org account needs a licence key.
      - name: secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: unit tests
        run: npm test

      # Separate from the tests above so a red build says which one broke:
      # a failing assertion, or coverage slipping below the threshold.
      - name: coverage
        run: npm run coverage

      # The gate. No API key, so the quality suites report as skipped and the
      # leak, trap, authorization, injection and budget suites decide the build.
      - name: evals
        run: npm run evals
